# MODEL_REGISTRY.yaml
# Comprehensive registry of all trained models in the deeplife / Chignolin project.
#
# PATHS: Checkpoints live under  deeplife/checkpoints/<family>/<version>/
#        Always use  best.pt  for evaluation (EMA weights, best val loss).
#        Never commit *.pt files (gitignored).
#
# STATUS:
#   production  — full training run, meaningful eval results
#   partial     — run completed or near-complete but known issues
#   smoke_test  — tiny model / ≤5 epochs, verification only
#   failed      — training stagnated (val_loss ≫ expected) or model catastrophically failed
#   in_progress — actively training, checkpoint is mid-run snapshot
#
# FRAMEWORKS:
#   ddpm         — Gaussian Diffusion (DDPM), Cα or all-atom Cartesian coords
#   flow_match   — SE(3)-equivariant OT-CFM, Cα or all-atom Cartesian coords
#   torsion_flow — OT-CFM on internal coordinate space (θ/φ dihedral torus)
#   backbone_ipa — IPA-Transformer + torsion flow on (φ,ψ) backbone angles
#
# HOW TO EVALUATE (after finding the checkpoint):
#   python scripts/evaluate.py --ckpt checkpoints/<family>/<ver>/best.pt --test data/test.npz --n 1000 --steps 100
#   python scripts/quick_sample.py --checkpoint checkpoints/<family>/<ver>/best.pt --n 50 --steps 100
#
# ──────────────────────────────────────────────────────────────────────────────
# WHEN YOU TRAIN A NEW MODEL: add an entry to this file following the template
# at the bottom. Also update COLLAB/STATUS.md and COLLAB/TODO.md.
# ──────────────────────────────────────────────────────────────────────────────

# Reference values (Chignolin MD ensemble, Cα-only unless noted)
reference:
  bond_validity_0.5pct: 100
  bond_validity_0.2pct: 98
  bond_rmse_ang: 0.063
  rg_mean_ang: 5.92
  rg_std_ang: 1.11
  ete_mean_ang: 12.0
  diversity_rmsd_ang: 3.79

models:

  # ════════════════════════════════════════════════════════════════════
  # GROUP 1 — Transformer DDPM (Cα, Cartesian)
  # Score network: TransformerScoreNetwork (residues as tokens, self-attention)
  # Diffusion: GaussianDiffusion (DDPM); ZeroCoM subspace NOT used.
  # ════════════════════════════════════════════════════════════════════

  - id: baseline/v1
    name: Transformer-DDPM-v1
    family: baseline
    version: v1
    model_type: transformer
    framework: ddpm
    data: ca_only
    description: >
      TransformerScoreNetwork (128 hidden, 4 layers) + GaussianDiffusion.
      Run stopped at epoch 19 — incomplete, do not use for evaluation.
    architecture:
      hidden_dim: 128
      n_layers: 4
      n_heads: 4
      augment_se3: false
    training:
      epochs_run: 19
      target_epochs: 500
      best_val_loss: 0.7896
    checkpoint: checkpoints/baseline/v1/best.pt
    eval_metrics: null
    status: partial
    notes: "Stopped at epoch 19 (early). Likely an interrupted run."

  - id: baseline/v2
    name: Transformer-DDPM-v2-LargeBatch
    family: baseline
    version: v2
    model_type: transformer
    framework: ddpm
    data: ca_only
    description: >
      Same architecture as v1 but trained with batch_size=2048.
      Poor convergence due to large batch — do not use.
    architecture:
      hidden_dim: 128
      n_layers: 4
      n_heads: 4
      batch_size: 2048
    training:
      epochs_run: 129
      target_epochs: 500
      best_val_loss: 0.7495
    checkpoint: checkpoints/baseline/v2/best.pt
    eval_metrics: null
