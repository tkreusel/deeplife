      bond_rmse_ang: 0.272
      rg_mean_ang: 5.65
      ete_mean_ang: 10.69
      mmd: 0.0323
      diversity_rmsd_ang: 7.80
    status: production
    notes: >
      AdaLN alone provides +37pp bond validity vs baseline (47.2%→75.4%).
      Energy and physics add on top. Key ablation control.

