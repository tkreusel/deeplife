  - id: transformer_adaln/v1
    name: AdaLN-Transformer-v1
    family: transformer_adaln
    version: v1
    model_type: transformer_adaln
    framework: ddpm
    data: ca_only
    description: >
      AdaLNTransformerScoreNetwork: Transformer with Adaptive Layer Normalization
      (AdaLN-Zero per layer, zero-init scale/shift/gate). No energy conditioning,
      no physics loss. Ablation model to isolate the AdaLN contribution.
    architecture:
      hidden_dim: 256
      n_layers: 6
      n_heads: 8
      adaLN: true
      energy_conditioning: false
      physics_weight: 0.0
    training:
      epochs_run: 419
      target_epochs: 500
      best_val_loss: 0.1836
    checkpoint: checkpoints/transformer_adaln/v1/best.pt
    eval_metrics:
