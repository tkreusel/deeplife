experiment_name: chignolin_backbone_transformer_local

data:
  train_path:  data_backbone/train.npz
  val_path:    data_backbone/val.npz
  test_path:   data_backbone/test.npz
  n_residues:  10
  coord_scale: 3.42
  augment_se3: false

model_type: backbone_transformer

model:
  hidden_dim:       64
  n_heads:          4
  n_layers:         2
  time_dim:         32
  dropout:          0.0
  energy_drop_prob: 0.15

diffusion:
  T:        500
  schedule: cosine

physics:
  bond_weight:  2.0
  clash_weight: 0.1
  angle_weight: 0.5

training:
  batch_size:    32
  n_epochs:      5
  lr:            0.001
  warmup_steps:  10
  grad_clip:     1.0
  ema_decay:     0.999
  physics_weight: 0.05
  val_every:     1
  save_every:    5
  num_workers:   0

paths:
  checkpoint_dir: checkpoints/backbone_transformer_local
