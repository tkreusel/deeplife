experiment_name: "chignolin_flowmatch_energy"
model_type:      "flowmatch_energy"    # SE(3) flow matching + energy conditioning (CFG)

# ── Data ──────────────────────────────────────────────────────────────────────
data:
  train_path:  "data/train.npz"
  val_path:    "data/val.npz"
  test_path:   "data/test.npz"
  n_residues:  10
  augment_se3: false
  coord_scale: 5.0

# ── Flow matching ─────────────────────────────────────────────────────────────
flow:
  sigma_min: 1.0e-4

# ── EGNN velocity network — tiny model for CPU smoke test (~2 min) ────────────
model:
  hidden_dim:       32
  edge_dim:         16
  n_layers:         2
  time_dim:         16
  energy_dim:       16    # energy embedding (new)
  energy_drop_prob: 0.15  # CFG dropout (new)
  dropout:          0.0

# ── Training ──────────────────────────────────────────────────────────────────
training:
  batch_size:   32
  lr:           1.0e-4
  n_epochs:     5
  warmup_steps: 10
  grad_clip:    1.0
  ema_decay:    0.9999
  val_every:    1
  save_every:   5
  num_workers:  0     # 0 for CPU
  amp:          false

# ── Checkpoints ───────────────────────────────────────────────────────────────
paths:
  checkpoint_dir: "checkpoints/flowmatch_energy"
