experiment_name: "chignolin_flowmatch_v2_energy"
model_type:      "flowmatch_v2_energy"   # CPU smoke test — tiny model

# ── Data ──────────────────────────────────────────────────────────────────────
data:
  train_path:  "data/train.npz"
  val_path:    "data/val.npz"
  test_path:   "data/test.npz"
  n_residues:  10
  augment_se3: false
  coord_scale: 5.0

# ── Flow matching ─────────────────────────────────────────────────────────────
flow:
  sigma_min: 1.0e-4

# ── Tiny model for CPU test (~2 min) ──────────────────────────────────────────
model:
  hidden_dim:       32
  edge_dim:         16
  n_layers:         2
  time_dim:         16
  energy_dim:       16
  energy_drop_prob: 0.15
  n_rbf:            8       # fewer RBF centres for speed
  sep_dim:          4
  x1_pred:          true
  dropout:          0.0

# ── Physics constraints ───────────────────────────────────────────────────────
physics:
  bond_weight:  2.0
  clash_weight: 0.1
  angle_weight: 0.5

# ── Training ──────────────────────────────────────────────────────────────────
training:
  batch_size:     32
  lr:             1.0e-4
  n_epochs:       5
  warmup_steps:   10
  grad_clip:      1.0
  ema_decay:      0.9999
  val_every:      1
  save_every:     5
  num_workers:    0       # CPU
  amp:            false
  physics_weight: 0.15

# ── Checkpoints ───────────────────────────────────────────────────────────────
paths:
  checkpoint_dir: "checkpoints/flowmatch_v2_energy"
